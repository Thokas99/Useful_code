single_cell:
  title: Single-cell RNA
  slug: single-cell
  description: Single-cell analysis with Seurat, AnnData, and pyUCell.
  representative: Seurat QC and inference; AnnData velocity and activity; Python signature scoring
  notebooks:
    - title: Single-cell RNA in R
      path: templates/single_cell/guide_r.qmd
      template_class: SOURCE-BACKED WORKFLOW
      status: draft
      description: Carry one Seurat object through QC, clustering, MAST markers, sample-level pseudobulk, signatures, trajectories, and coexpression modules.
    - title: Single-cell RNA in Python
      path: templates/single_cell/guide_python.qmd
      template_class: SOURCE-BACKED WORKFLOW
      status: draft
      description: Estimate velocity and fate probabilities, then score network activity with AnnData; scCellFie is optional.
    - title: Gene signature scoring in Python with pyUCell
      path: templates/single_cell/guide_pyucell.qmd
      template_class: API / TUTORIAL REMINDER
      status: draft
      description: Score supplied gene signatures from an explicit counts layer, inspect gene coverage, and save cell scores, plots, and AnnData.

bulk_rna:
  title: Bulk RNA
  slug: bulk-rna
  description: One count-aware edgeR workflow from tximport through sample-level scoring.
  representative: tximport, QC, differential expression, GSEA, singscore, GSVA
  notebooks:
    - title: Bulk RNA-seq in R
      path: templates/bulk_rna/guide.qmd
      template_class: SOURCE-BACKED WORKFLOW
      status: draft
      description: Carry one edgeR DGEList through filtering, normalization, differential expression, ranked enrichment, and sample scoring.

scatac:
  title: scATAC-seq
  slug: scatac
  description: One Signac workflow from count matrix and fragments through motif analysis.
  representative: Signac QC, LSI, differential peaks, motifs, chromVAR
  notebooks:
    - title: scATAC-seq in R
      path: templates/scatac/guide.qmd
      template_class: SOURCE-BACKED WORKFLOW
      status: draft
      description: Carry one Signac object through fragment-aware QC, LSI, peak testing, motif enrichment, and optional chromVAR.

multiome:
  title: Multiome
  slug: multiome
  description: One paired RNA/ATAC workflow for QC, WNN, linkage, and label transfer.
  representative: paired QC, weighted nearest neighbors, peak-gene links, label transfer
  notebooks:
    - title: Paired RNA and ATAC in R
      path: templates/multiome/guide.qmd
      template_class: SOURCE-BACKED WORKFLOW
      status: draft
      description: Carry one paired Seurat object through cell matching, QC, WNN, peak-to-gene linkage, and optional RNA-reference label transfer.

mofa:
  title: Multi-omics / MOFA
  slug: mofa
  description: One MOFA2 workflow from matched views through model diagnostics and interpretation.
  representative: view matching, fitting, factors, variance, weights
  notebooks:
    - title: Multi-omics with MOFA2
      path: templates/multiomics/mofa/guide.qmd
      template_class: SOURCE-BACKED WORKFLOW
      status: draft
      description: Fit one MOFA2 model from matched modality matrices, inspect variance and factors, and export weights and optional metadata associations.

biomarker_ml:
  title: Biomarker machine learning
  slug: biomarker-ml
  description: One sample-level bias-reduced classifier with a locked held-out evaluation.
  representative: brglm2 classification and held-out reporting
  notebooks:
    - title: Sample-level biomarker classification
      path: templates/machine_learning/biomarkers/guide.qmd
      template_class: SOURCE-BACKED WORKFLOW
      status: draft
      description: Fit a sample-level classifier with patient-grouped splits, then report held-out metrics once per patient.
