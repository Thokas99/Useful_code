<script>
(function () {
  try {
    var theme = window.localStorage.getItem("useful-code-theme");
    if (theme !== "modern_dark" && theme !== "modern_light") return;

    var stylesheet = document.querySelector(
      'link[rel="stylesheet"]:not(#jtd-head-nav-stylesheet)'
    );
    if (stylesheet) {
      stylesheet.href = '{{ "/assets/css/just-the-docs-" | relative_url }}' + theme + ".css";
    }
  } catch (error) {
    // Theme preference is optional; the default dark scheme remains available.
  }
}());
</script>
<script src="{{ "/assets/js/theme-toggle.js" | relative_url }}" defer></script>
