<a class="family-card" href="{{ site.baseurl }}/methods/{{ include.family.slug }}/">
  <p class="card-title">{{ include.family.title }}</p>
  <p class="card-count">{{ include.family.notebooks.size }} canonical notebooks</p>
  <p>{{ include.family.description }}</p>
  <p class="card-includes"><strong>Includes:</strong> {{ include.family.representative }}</p>
  <span class="card-link">Browse family <span aria-hidden="true">&rarr;</span></span>
</a>
